name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: NDK e CMake
        run: sdkmanager --install "ndk;29.0.13113456" "cmake;3.31.6" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache build nativa (llama.cpp)
        uses: actions/cache@v4
        with:
          path: android/app/.cxx
          key: cxx-${{ hashFiles('android/app/src/main/cpp/**', 'android/app/build.gradle.kts') }}

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/vextor.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: vextor-apk
          path: vextor.apk

      - name: Pubblica release "apk-latest"
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest vextor.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Vextor APK (ultima build)" \
            --notes "Build automatica da ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Apri questa pagina dal telefono e scarica vextor.apk."
